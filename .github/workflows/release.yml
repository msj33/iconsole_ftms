name: Release macOS app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag version
        id: vars
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "tag_version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate VERSION matches tag
        run: |
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$FILE_VERSION"
          if [[ "$FILE_VERSION" != "${{ steps.vars.outputs.tag_version }}" ]]; then
            echo "VERSION file ($FILE_VERSION) must match tag version (${{ steps.vars.outputs.tag_version }})"
            exit 1
          fi

      - name: Build macOS app
        run: |
          chmod +x ./build_macos_app.sh
          ./build_macos_app.sh "${{ steps.vars.outputs.tag_version }}"

      - name: Validate built app version
        run: |
          APP_PATH="dist/iConsole FTMS.app"
          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Contents/Info.plist")"
          RESOURCE_VERSION="$(tr -d '[:space:]' < "$APP_PATH/Contents/Resources/APP_VERSION")"
          if [[ "$PLIST_VERSION" != "${{ steps.vars.outputs.tag_version }}" ]]; then
            echo "Built app Info.plist version ($PLIST_VERSION) does not match tag version (${{ steps.vars.outputs.tag_version }})"
            exit 1
          fi
          if [[ "$RESOURCE_VERSION" != "${{ steps.vars.outputs.tag_version }}" ]]; then
            echo "Built app APP_VERSION ($RESOURCE_VERSION) does not match tag version (${{ steps.vars.outputs.tag_version }})"
            exit 1
          fi

      - name: Package release dmg
        run: |
          DMG_NAME="iConsole-FTMS-macOS-v${{ steps.vars.outputs.tag_version }}.dmg"
          DMG_ROOT="dist/dmg-root"
          rm -rf "$DMG_ROOT"
          mkdir -p "$DMG_ROOT"
          cp -R "dist/iConsole FTMS.app" "$DMG_ROOT/"
          cat > "$DMG_ROOT/Install iConsole FTMS.command" <<'EOF'
          #!/bin/bash
          set -euo pipefail
          SRC_DIR="$(cd "$(dirname "$0")" && pwd)"
          SRC_APP="$SRC_DIR/iConsole FTMS.app"
          DEST_APP="/Applications/iConsole FTMS.app"

          if [[ ! -d "$SRC_APP" ]]; then
            echo "Could not find iConsole FTMS.app next to this installer script."
            exit 1
          fi

          rm -rf "$DEST_APP"
          cp -R "$SRC_APP" "/Applications/"
          xattr -dr com.apple.quarantine "$DEST_APP" || true
          open "$DEST_APP"
          echo "Installed to /Applications and launched."
          EOF
          chmod +x "$DMG_ROOT/Install iConsole FTMS.command"
          ln -s /Applications "$DMG_ROOT/Applications"
          hdiutil create \
            -volname "iConsole FTMS" \
            -srcfolder "$DMG_ROOT" \
            -ov -format UDZO \
            "dist/$DMG_NAME"
          rm -rf "$DMG_ROOT"
          echo "DMG_NAME=$DMG_NAME" >> "$GITHUB_ENV"

      - name: Build release notes
        run: |
          CURRENT_TAG="v${{ steps.vars.outputs.tag_version }}"
          PREVIOUS_TAG="$(git tag --list 'v*' --sort=-version:refname | grep -Fxv "$CURRENT_TAG" | head -n 1 || true)"
          COMMIT_RANGE="${CURRENT_TAG}"
          if [[ -n "$PREVIOUS_TAG" ]]; then
            COMMIT_RANGE="${PREVIOUS_TAG}..${CURRENT_TAG}"
          fi

          COMMITS="$(git log --no-merges --pretty='- %s (%h)' ${COMMIT_RANGE} | cat)"
          if [[ -z "$COMMITS" ]]; then
            COMMITS="- No code changes found."
          fi

          cat > dist/RELEASE_NOTES.md <<EOF
          ## iConsole FTMS v${{ steps.vars.outputs.tag_version }}

          ### Changes since last release
          EOF
          printf "%s\n" "$COMMITS" >> dist/RELEASE_NOTES.md
          cat >> dist/RELEASE_NOTES.md <<EOF

          ### Install
          - Download **iConsole-FTMS-macOS-v${{ steps.vars.outputs.tag_version }}.dmg**
          - Open the DMG
          - Drag **iConsole FTMS.app** to **Applications**
          - If macOS blocks first launch: in Applications, right-click **iConsole FTMS.app** → **Open** → **Open**
          - Start the app from **Applications**
          EOF

      - name: Remove legacy zip asset (if present)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete-asset "v${{ steps.vars.outputs.tag_version }}" \
            "iConsole-FTMS-macOS-v${{ steps.vars.outputs.tag_version }}.zip" \
            --yes || true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          body_path: dist/RELEASE_NOTES.md
          files: dist/${{ env.DMG_NAME }}
