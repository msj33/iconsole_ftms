name: Release macOS app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Apple notarization secrets
        run: |
          test -n "${{ secrets.APPLE_ID }}"
          test -n "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}"
          test -n "${{ secrets.APPLE_TEAM_ID }}"
          test -n "${{ secrets.APPLE_DEVELOPER_ID_APP_CERT_BASE64 }}"
          test -n "${{ secrets.APPLE_DEVELOPER_ID_APP_CERT_PASSWORD }}"

      - name: Resolve tag version
        id: vars
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "tag_version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificate
        env:
          CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APP_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APP_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/developer_id_app.p12"
          echo "$CERT_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "actions" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "actions" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "actions" "$KEYCHAIN_PATH"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*\"\\(Developer ID Application:.*\\)\".*/\\1/p' | head -n 1)"
          if [[ -z "$IDENTITY" ]]; then
            echo "No Developer ID Application identity found in keychain"
            exit 1
          fi
          echo "ICONSOLE_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Validate VERSION matches tag
        run: |
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$FILE_VERSION"
          if [[ "$FILE_VERSION" != "${{ steps.vars.outputs.tag_version }}" ]]; then
            echo "VERSION file ($FILE_VERSION) must match tag version (${{ steps.vars.outputs.tag_version }})"
            exit 1
          fi

      - name: Build macOS app
        run: |
          chmod +x ./build_macos_app.sh
          ICONSOLE_SIGN_IDENTITY="${ICONSOLE_SIGN_IDENTITY}" ./build_macos_app.sh "${{ steps.vars.outputs.tag_version }}"

      - name: Package release dmg
        run: |
          DMG_NAME="iConsole-FTMS-macOS-v${{ steps.vars.outputs.tag_version }}.dmg"
          DMG_ROOT="dist/dmg-root"
          rm -rf "$DMG_ROOT"
          mkdir -p "$DMG_ROOT"
          cp -R "dist/iConsole FTMS.app" "$DMG_ROOT/"
          ln -s /Applications "$DMG_ROOT/Applications"
          hdiutil create \
            -volname "iConsole FTMS" \
            -srcfolder "$DMG_ROOT" \
            -ov -format UDZO \
            "dist/$DMG_NAME"
          codesign --force --timestamp --sign "${ICONSOLE_SIGN_IDENTITY}" "dist/$DMG_NAME"
          xcrun notarytool submit "dist/$DMG_NAME" \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --wait
          xcrun stapler staple "dist/$DMG_NAME"
          rm -rf "$DMG_ROOT"
          echo "DMG_NAME=$DMG_NAME" >> "$GITHUB_ENV"

      - name: Build release notes
        run: |
          cat > dist/RELEASE_NOTES.md <<'EOF'
          ## iConsole FTMS v${{ steps.vars.outputs.tag_version }}

          ### Features
          - Native macOS app (iConsole FTMS.app) with Dock/taskbar integration.
          - Bluetooth bridge from iConsole bike data to FTMS/Cycling Power for MyWhoosh.
          - Full-screen responsive web dashboard embedded in the app.
          - Connect-first device picker with one-tap bike selection.
          - Simple/Advanced riding modes.
          - Manual resistance +/- control and auto-base resistance control.
          - Automatic reconnect when bike connection is lost.
          - Home-network access tip with detected local IP.
          - Built-in custom app icon and app version display in UI.

          ### Install
          - Download **iConsole-FTMS-macOS-v${{ steps.vars.outputs.tag_version }}.dmg**
          - Open the DMG
          - Drag **iConsole FTMS.app** to **Applications**
          - Start the app from **Applications**
          EOF

      - name: Remove legacy zip asset (if present)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete-asset "v${{ steps.vars.outputs.tag_version }}" \
            "iConsole-FTMS-macOS-v${{ steps.vars.outputs.tag_version }}.zip" \
            --yes || true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          body_path: dist/RELEASE_NOTES.md
          files: dist/${{ env.DMG_NAME }}
